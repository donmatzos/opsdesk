# Reusable Maven build: any repo/workflow calls it and configures it only through inputs
# (the GitHub counterpart of the shared GitLab template in ci/gitlab/, see docs/context/ops.md).
name: maven-verify

on:
  workflow_call:
    inputs:
      java-version:
        description: Temurin Java version
        type: string
        default: "25"
      sonar:
        description: Run SonarCloud analysis (skipped automatically when SONAR_TOKEN is not available)
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, analyse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Fork and Dependabot PRs get a read-only token: annotate only instead of creating a check run.
      READ_ONLY_TOKEN: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar blame / new-code detection

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Cache Node and npm (installed by frontend-maven-plugin)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/node
            ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('pom.xml', 'frontend/package-lock.json') }}

      - name: Build and test (TestNG + Testcontainers, Vitest, coverage)
        run: ./mvnw -B -ntp verify

      - name: SonarCloud analysis
        if: inputs.sonar && env.SONAR_TOKEN != ''
        run: ./mvnw -B -ntp sonar:sonar

      - name: Test report (backend + frontend)
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          # One glob (braces) = one combined report. Separate lines would create one check per line
          # under the same name, and the last one hides the others.
          report_paths: "{backend/target/surefire-reports/TEST-*.xml,ai/target/surefire-reports/TEST-*.xml,frontend/target/test-reports/*.xml}"
          check_name: Test report
          include_passed: true
          detailed_summary: true
          annotate_only: ${{ env.READ_ONLY_TOKEN == 'true' }}

      - name: Upload raw reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            ai/target/surefire-reports/
            backend/target/site/jacoco/
            ai/target/site/jacoco/
            frontend/target/test-reports/
            frontend/coverage/
          retention-days: 7
