# Build and test on every push and pull request. Small on purpose; scans, image and deploy come in later phases
# (docs/plans/2026-11-10-roadmap.md). No secrets needed: Testcontainers starts its own PostgreSQL.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Cache Node and npm (installed by frontend-maven-plugin)
        uses: actions/cache@v6
        with:
          path: |
            frontend/node
            ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('pom.xml', 'frontend/package-lock.json') }}

      - name: Build and test (backend TestNG + Testcontainers, frontend Vitest)
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
