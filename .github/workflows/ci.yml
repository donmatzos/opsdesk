# CI/CD: build + tests + Sonar (reusable workflow), secret scan, Trivy (repo and image), container smoke test,
# image publish to GHCR from main when the repository variable PUBLISH_IMAGE is 'true'.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: it may be pushing or cleaning up the registry.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # SARIF upload: PRs from this repo (not forks/Dependabot: no security-events: write) and main. Feature-branch push
  # runs skip it: the PR run uploads the same commit, and a branch deleted after merge makes the upload fail.
  CAN_UPLOAD_SARIF: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  verify:
    uses: ./.github/workflows/maven-verify.yml
    permissions:
      contents: read
      checks: write
    with:
      sonar: true
    secrets: inherit

  context-check:
    name: Context size check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/context_check.py

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  trivy-fs:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # trivy.yaml: skips pom.xml (Maven Central rate limits; jars are scanned in the image job) and renders
      # the Helm chart with the dev values so its misconfigurations are checked.
      - name: Scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Upload to code scanning
        if: env.CAN_UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Gate (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  helm:
    name: Helm chart (lint, unit tests, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: helm lint + helm-unittest + kubeconform (Docker)
        run: tools/helm-check.sh

  image:
    name: Image (build, scan, smoke test)
    needs: [verify, trivy-fs, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            opsdesk:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsdesk:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - name: Upload to code scanning
        if: env.CAN_UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Gate (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opsdesk:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Smoke test (random UID, read-only root FS, throwaway PostgreSQL)
        run: tools/ci-smoke.sh opsdesk:ci

  publish:
    name: Publish image to GHCR
    # Only main, only when switched on, and only after every check (incl. the secret scan) is green.
    # The only job with packages: write; no branch or PR code runs with it.
    needs: [image, secrets, context-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt from the GHA layer cache of the image job (same layers as scanned and smoke-tested).
      # provenance/sbom off: one registry version per push, so the cleanup below counts pushes.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Keep only the newest 10 image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10

  deploy-dev:
    name: Deploy to OpenShift (dev)
    # Switched on with the repository variable OPENSHIFT_DEPLOY=true; needs the published image.
    # Setup (Developer Sandbox, service account, secrets): deploy/openshift/README.md
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OPENSHIFT_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: openshift-dev
      url: ${{ steps.route.outputs.url }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      OC_VERSION: 5.0.1
      RELEASE: opsdesk
      NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install oc ${{ env.OC_VERSION }} (checksum verified)
        run: |
          base="https://mirror.openshift.com/pub/openshift-v4/clients/ocp/${OC_VERSION}"
          curl -fsSLO "${base}/openshift-client-linux.tar.gz"
          curl -fsSL "${base}/sha256sum.txt" | grep ' openshift-client-linux.tar.gz$' | sha256sum -c -
          sudo tar -xzf openshift-client-linux.tar.gz -C /usr/local/bin oc
          oc version --client

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Log in to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          oc login --token="${OPENSHIFT_TOKEN}" --server="${OPENSHIFT_SERVER}" > /dev/null
          oc project "${NAMESPACE}"

      - name: Deploy (rolls back by itself if the rollout fails)
        run: >-
          helm upgrade --install "${RELEASE}" deploy/helm/opsdesk -n "${NAMESPACE}"
          -f deploy/helm/opsdesk/values-dev.yaml
          --set image.tag="sha-${GITHUB_SHA::7}"
          --rollback-on-failure --wait --timeout 6m

      - name: Route URL
        id: route
        run: echo "url=https://$(oc get route "${RELEASE}" -n "${NAMESPACE}" -o jsonpath='{.spec.host}')" >> "${GITHUB_OUTPUT}"

      - name: Smoke test (roll back to the previous release on failure)
        env:
          URL: ${{ steps.route.outputs.url }}
        run: |
          if ! tools/smoke-test.sh "${URL}" 180; then
            if (( $(helm history "${RELEASE}" -n "${NAMESPACE}" -o json | jq length) > 1 )); then
              helm rollback "${RELEASE}" -n "${NAMESPACE}" --wait
            else
              echo "First release: nothing to roll back to."
            fi
            exit 1
          fi

      - name: Release status
        if: always()
        run: |
          helm history "${RELEASE}" -n "${NAMESPACE}" --max 5 || true
          oc get pods -n "${NAMESPACE}" -o wide || true
