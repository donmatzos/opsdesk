# Weekly dependency updates; minor + patch grouped per ecosystem to keep PRs few.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      maven-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    ignore:
      # Angular decides the supported TypeScript range (it caps minors too; TypeScript is not semver).
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      actions-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/datadog
      - /infra/terraform/azure
    schedule: { interval: weekly }
    labels: [dependencies]
