spring:
  application:
    name: opsdesk
  mvc:
    problemdetails:
      enabled: true
  # Local defaults match deploy/compose/compose.yml (dev only). Clusters set SPRING_DATASOURCE_* from a Secret.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opsdesk}
    username: ${SPRING_DATASOURCE_USERNAME:opsdesk}
    password: ${SPRING_DATASOURCE_PASSWORD}
