spring:
  application:
    name: opsdesk
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    # Finish in-flight requests before the pod stops (Kubernetes sends SIGTERM, then waits terminationGracePeriodSeconds).
    timeout-per-shutdown-phase: 20s
  # No fallbacks on purpose: a stage without SPRING_DATASOURCE_* (from a Secret) fails fast.
  # Never put a password in this file, not even a local one.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  ai:
    mcp:
      server:
        name: opsdesk
        version: "@project.version@"
        # Stateless: no session state in the pod, so any replica can answer any request (no sticky routing).
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
        instructions: >-
          opsdesk is a service-status and incident desk. Use the tools to look up monitored services
          and their health, and to read or work on incidents. Tools return compact JSON.

opsdesk:
  mcp:
    # Bearer token for /mcp from the environment. Empty = MCP disabled (503); the rest of the app is unaffected.
    token: ${OPSDESK_MCP_TOKEN:}

server:
  shutdown: graceful

# Actuator on its own port: never routed to the outside (Route/Ingress go to 8080 only); Prometheus scrapes 9090.
# Probes are additionally served on the app port as /livez and /readyz, so Kubernetes and smoke tests use 8080.
management:
  server:
    port: 9090
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  endpoints:
    web:
      exposure:
        # Only what operations needs; everything else (env, beans, ...) stays closed.
        include: health,info,prometheus
  metrics:
    tags:
      application: opsdesk
  # MOCK: Datadog export is off; profile "datadog" below switches it on (key from the environment only).
  datadog:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0

# Structured logs: the container image sets LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (Elastic Common Schema);
# a local java -jar stays human-readable.
logging:
  structured:
    ecs:
      service:
        name: opsdesk
        environment: ${OPSDESK_ENV:local}
    json:
      # Micrometer puts traceId/spanId into the MDC; ECS names them trace.id/span.id (Kibana/APM correlation).
      rename:
        traceId: trace.id
        spanId: span.id

---
# Demo data for local runs, tests and the showcase; never active in a real stage.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  # Host and user match deploy/compose/compose.yml; the password always comes from SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opsdesk}
    username: ${SPRING_DATASOURCE_USERNAME:opsdesk}

---
# MOCK: no Datadog account exists. Shows how metrics would be pushed to Datadog: the API key comes only from the
# environment (DATADOG_API_KEY, never a default); DatadogKeyCheck stops the start when it is missing.
spring:
  config:
    activate:
      on-profile: datadog
management:
  datadog:
    metrics:
      export:
        enabled: true
        api-key: ${DATADOG_API_KEY}
        uri: ${DATADOG_SITE_URI:https://api.datadoghq.eu}
        step: 30s
  # The registry posts straight to the Datadog API (no agent in between), so Unified Service Tagging must be set
  # as metric tags here; the Helm chart fills DD_SERVICE/DD_ENV/DD_VERSION.
  metrics:
    tags:
      service: ${DD_SERVICE:opsdesk}
      env: ${DD_ENV:local}
      version: ${DD_VERSION:unknown}
