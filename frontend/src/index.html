<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>opsdesk</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply a stored theme choice before first paint (no flash); see app/layout/theme.service.ts
    try {
      var t = localStorage.getItem('opsdesk.theme');
      if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; }
    } catch (e) { /* storage blocked: follow the system */ }
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
