<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="t d">
  <title id="t">opsdesk architecture overview</title>
  <desc id="d">A browser and an AI client call the Spring Boot application, which contains the REST API, the MCP server and the runbook assistant and uses PostgreSQL. Metrics and logs go to monitoring. A pipeline builds the jar and image and deploys them with Helm to OpenShift.</desc>
  <!-- Self-contained light card: it reads the same on the light and the dark page theme (an SVG used as an image cannot follow the theme toggle). -->
  <style>
    .paper { fill: #f6f7fb; stroke: #d5d9e6; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; }
    .app { fill: #edeff7; stroke: #4338ca; stroke-width: 2; }
    .line { stroke: #4b5563; stroke-width: 2; fill: none; }
    text { font: 14px system-ui, sans-serif; fill: #111827; }
    .small { font-size: 12px; fill: #4b5563; }
    .head { font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect class="paper" x="0.5" y="0.5" width="759" height="369" rx="12" />
  <rect class="box" x="24" y="34" width="140" height="50" rx="8" /><text x="94" y="64" text-anchor="middle">Browser (Angular)</text>
  <rect class="box" x="24" y="124" width="140" height="50" rx="8" /><text x="94" y="154" text-anchor="middle">AI client (MCP)</text>
  <rect class="app" x="244" y="24" width="250" height="190" rx="10" />
  <text class="head" x="369" y="50" text-anchor="middle">Spring Boot (one jar)</text>
  <rect class="box" x="264" y="64" width="210" height="34" rx="6" /><text x="369" y="86" text-anchor="middle">REST API + domain</text>
  <rect class="box" x="264" y="108" width="210" height="34" rx="6" /><text x="369" y="130" text-anchor="middle">MCP server (/mcp)</text>
  <rect class="box" x="264" y="152" width="210" height="34" rx="6" /><text x="369" y="174" text-anchor="middle">Runbook assistant (BM25)</text>
  <rect class="box" x="560" y="56" width="176" height="52" rx="8" /><text x="648" y="86" text-anchor="middle">PostgreSQL</text>
  <rect class="box" x="560" y="136" width="176" height="62" rx="8" /><text x="648" y="162" text-anchor="middle">Prometheus, Elastic,</text><text x="648" y="181" text-anchor="middle">Datadog (mock)</text>
  <path class="line" d="M164 59 H244" marker-end="url(#a)" /><path class="line" d="M164 149 H244" marker-end="url(#a)" />
  <path class="line" d="M494 82 H560" marker-end="url(#a)" /><path class="line" d="M494 167 H560" marker-end="url(#a)" />
  <rect class="box" x="24" y="262" width="110" height="52" rx="8" /><text x="79" y="293" text-anchor="middle">Pipeline</text>
  <rect class="box" x="204" y="262" width="140" height="52" rx="8" /><text x="274" y="293" text-anchor="middle">Jar + image</text>
  <rect class="box" x="414" y="262" width="110" height="52" rx="8" /><text x="469" y="293" text-anchor="middle">Helm</text>
  <rect class="box" x="594" y="262" width="142" height="52" rx="8" /><text x="665" y="293" text-anchor="middle">OpenShift</text>
  <path class="line" d="M134 288 H204" marker-end="url(#a)" /><path class="line" d="M344 288 H414" marker-end="url(#a)" /><path class="line" d="M524 288 H594" marker-end="url(#a)" />
  <text x="380" y="350" text-anchor="middle" class="small">Mocked or off by default: Azure OpenAI / AI Search, Datadog, real cluster</text>
</svg>
