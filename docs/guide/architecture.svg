<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">opsdesk architecture overview</title>
  <desc id="d">A browser and an AI client call the Spring Boot application, which contains the REST API, the MCP server and the runbook assistant and uses PostgreSQL. Metrics and logs go to monitoring. A pipeline builds the jar and image and deploys them with Helm to OpenShift.</desc>
  <style>
    .box { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
    .app { fill: #e2e8f0; stroke: #15803d; stroke-width: 2; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
    text { font: 14px system-ui, sans-serif; fill: #0f172a; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e293b; stroke: #94a3b8; }
      .app { fill: #334155; stroke: #22c55e; }
      .line { stroke: #94a3b8; }
      text { fill: #f8fafc; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="line" style="fill: currentColor; stroke: none" />
    </marker>
  </defs>
  <rect class="box" x="20" y="30" width="130" height="50" rx="6" /><text x="85" y="60" text-anchor="middle">Browser (Angular)</text>
  <rect class="box" x="20" y="120" width="130" height="50" rx="6" /><text x="85" y="150" text-anchor="middle">AI client (MCP)</text>
  <rect class="app" x="230" y="20" width="250" height="190" rx="8" />
  <text x="355" y="46" text-anchor="middle" style="font-weight:600">Spring Boot (one jar)</text>
  <rect class="box" x="250" y="60" width="210" height="34" rx="6" /><text x="355" y="82" text-anchor="middle">REST API + domain</text>
  <rect class="box" x="250" y="104" width="210" height="34" rx="6" /><text x="355" y="126" text-anchor="middle">MCP server (/mcp)</text>
  <rect class="box" x="250" y="148" width="210" height="34" rx="6" /><text x="355" y="170" text-anchor="middle">Runbook assistant (BM25)</text>
  <rect class="box" x="560" y="60" width="140" height="50" rx="6" /><text x="630" y="90" text-anchor="middle">PostgreSQL</text>
  <rect class="box" x="560" y="140" width="140" height="50" rx="6" /><text x="630" y="162" text-anchor="middle">Prometheus,</text><text x="630" y="180" text-anchor="middle">Elastic, Datadog (mock)</text>
  <path class="line" d="M150 55 H230" marker-end="url(#a)" /><path class="line" d="M150 145 H230" marker-end="url(#a)" />
  <path class="line" d="M480 77 H560" marker-end="url(#a)" /><path class="line" d="M480 165 H560" marker-end="url(#a)" />
  <rect class="box" x="20" y="260" width="100" height="50" rx="6" /><text x="70" y="290" text-anchor="middle">Pipeline</text>
  <rect class="box" x="190" y="260" width="130" height="50" rx="6" /><text x="255" y="290" text-anchor="middle">Jar + image</text>
  <rect class="box" x="390" y="260" width="100" height="50" rx="6" /><text x="440" y="290" text-anchor="middle">Helm</text>
  <rect class="box" x="560" y="260" width="140" height="50" rx="6" /><text x="630" y="290" text-anchor="middle">OpenShift</text>
  <path class="line" d="M120 285 H190" marker-end="url(#a)" /><path class="line" d="M320 285 H390" marker-end="url(#a)" /><path class="line" d="M490 285 H560" marker-end="url(#a)" />
  <text x="360" y="345" text-anchor="middle" class="small">Mocked or off by default: Azure OpenAI / AI Search, Datadog, real cluster</text>
</svg>
