# Local development only. The password comes from deploy/compose/.env (git-ignored), see .env.example.
name: opsdesk

services:
  postgres:
    image: postgres:18-alpine
    # The password comes only from .env (git-ignored, template .env.example); without it nothing starts.
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: opsdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full stack from the Dockerfile: docker compose -f deploy/compose/compose.yml --profile app up --build
  app:
    profiles: [app]
    build: ../..
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opsdesk
    ports:
      - "8080:8080"

volumes:
  postgres-data:
