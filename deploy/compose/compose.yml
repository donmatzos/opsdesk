# Local development only. The password comes from deploy/compose/.env (git-ignored), see .env.example.
name: opsdesk

services:
  postgres:
    image: postgres:18-alpine
    # The password comes only from .env (git-ignored, template .env.example); without it nothing starts.
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: opsdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full stack from the Dockerfile: docker compose -f deploy/compose/compose.yml --profile app up --build
  app:
    profiles: [app, observability]
    build: ../..
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opsdesk
      OPSDESK_ENV: compose
    ports:
      - "8080:8080"
      # Actuator (health, prometheus) on its own port, local only.
      - "127.0.0.1:9090:9090"

  # Local Elastic stack: docker compose -f deploy/compose/compose.yml --profile observability up -d
  # (or tools/elastic-verify.sh). Security is off on purpose for a local sandbox: no password exists, and both
  # services listen on 127.0.0.1 only. Needs ~2-3 GB RAM.
  elasticsearch:
    profiles: [observability]
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    profiles: [observability]
    image: kibana:9.5.5
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Ships the container log files (like a DaemonSet reads /var/log/containers in Kubernetes) and keeps only
  # opsdesk's ECS lines. Linux Docker path; root is needed to read /var/lib/docker/containers (read-only mount).
  filebeat:
    profiles: [observability]
    image: elastic/filebeat:9.5.6
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - filebeat-data:/usr/share/filebeat/data

volumes:
  postgres-data:
  elastic-data:
  filebeat-data:
