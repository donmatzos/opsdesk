{{- if .Values.networkPolicy.enabled }}
{{- $labels := .Values.networkPolicy.ingressNamespaceLabels }}
{{- if and .Values.ingress.enabled (empty $labels) }}
{{- fail "networkPolicy.ingressNamespaceLabels must select your ingress controller's namespace when ingress.enabled (e.g. kubernetes.io/metadata.name: ingress-nginx), or set networkPolicy.enabled=false" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsdesk.appSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # The ingress router (OpenShift: openshift-ingress namespace) ...
        - namespaceSelector:
            matchLabels:
              {{- toYaml ($labels | default (dict "policy-group.network.openshift.io/ingress" "")) | nindent 14 }}
        # ... and pods in the same namespace (e.g. a debug pod or the smoke test).
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
    # Management port only from the own namespace (Prometheus/agent there), never from the router.
    - from:
        - podSelector: {}
      ports:
        - port: 9090
          protocol: TCP
{{- end }}
