{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsdesk.appSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # The ingress router (OpenShift: openshift-ingress namespace) ...
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
        # ... and pods in the same namespace (e.g. a debug pod or the smoke test).
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
