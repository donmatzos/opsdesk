apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsdesk.fullname" . }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opsdesk.appSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
