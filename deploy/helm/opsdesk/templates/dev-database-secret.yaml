{{- if .Values.devDatabase.enabled }}
{{- $name := include "opsdesk.dbSecretName" . }}
{{- $key := .Values.database.passwordKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $value = index $existing.data $key }}
{{- else }}
{{- $value = randAlphaNum 32 | b64enc }}
{{- end }}
# Generated in the cluster on first install, reused on every upgrade (the database volume keeps the old
# password), and kept on uninstall together with the volume.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
