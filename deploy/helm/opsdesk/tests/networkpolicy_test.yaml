suite: network policy
templates:
  - networkpolicy.yaml
release:
  name: opsdesk
set:
  database.existingSecret: opsdesk-db
  database.url: jdbc:postgresql://db:5432/opsdesk
tests:
  - it: lets the OpenShift router and the own namespace reach the app on 8080 only
    asserts:
      - equal: { path: spec.policyTypes, value: [Ingress] }
      - contains:
          path: spec.ingress[0].from
          content:
            namespaceSelector:
              matchLabels:
                policy-group.network.openshift.io/ingress: ""
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector: {}
      - equal: { path: "spec.ingress[0].ports", value: [{ port: 8080, protocol: TCP }] }

  # Metrics only from inside the namespace (e.g. a Prometheus or agent there), never from the router.
  - it: allows the management port only from the own namespace
    asserts:
      - equal:
          path: spec.ingress[1]
          value:
            from:
              - podSelector: {}
            ports:
              - { port: 9090, protocol: TCP }

  - it: can be switched off
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  # Plain Kubernetes: the default selector is the OpenShift router namespace; an ingress controller elsewhere
  # would be blocked silently (502/504). Rendering must ask for the right namespace instead.
  - it: refuses Ingress mode while the policy still selects only the OpenShift router
    set:
      route.enabled: false
      ingress.enabled: true
      ingress.host: opsdesk.example.test
    asserts:
      - failedTemplate:
          errorMessage: "networkPolicy.ingressNamespaceLabels must select your ingress controller's namespace when ingress.enabled (e.g. kubernetes.io/metadata.name: ingress-nginx), or set networkPolicy.enabled=false"

  - it: admits the ingress controller namespace that is configured
    set:
      route.enabled: false
      ingress.enabled: true
      ingress.host: opsdesk.example.test
      networkPolicy.ingressNamespaceLabels:
        kubernetes.io/metadata.name: ingress-nginx
    asserts:
      - equal:
          path: spec.ingress[0].from[0]
          value:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
      - contains:
          path: spec.ingress[0].from
          content:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx

  # An empty matchLabels would admit every namespace; empty means "OpenShift router" instead.
  - it: never renders an empty namespace selector
    set:
      networkPolicy.ingressNamespaceLabels: {}
    asserts:
      - notContains:
          path: spec.ingress[0].from
          content:
            namespaceSelector:
              matchLabels: {}
      - contains:
          path: spec.ingress[0].from
          content:
            namespaceSelector:
              matchLabels:
                policy-group.network.openshift.io/ingress: ""

