suite: datadog (mocked)
templates:
  - deployment.yaml
release:
  name: opsdesk
set:
  database.existingSecret: opsdesk-db
  database.url: jdbc:postgresql://db:5432/opsdesk
tests:
  - it: adds nothing for Datadog by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: DD_ENV, value: dev }
      - notExists:
          path: spec.template.metadata.labels["tags.datadoghq.com/service"]

  - it: adds Unified Service Tagging, the agent host and the key from a Secret when enabled
    set:
      datadog.enabled: true
      datadog.env: dev
      datadog.apiKeySecret: datadog
      image.tag: sha-abc1234
    asserts:
      - equal:
          path: spec.template.metadata.labels["tags.datadoghq.com/service"]
          value: opsdesk
      - equal:
          path: spec.template.metadata.labels["tags.datadoghq.com/env"]
          value: dev
      - equal:
          path: spec.template.metadata.labels["tags.datadoghq.com/version"]
          value: sha-abc1234
      - equal:
          path: metadata.labels["tags.datadoghq.com/service"]
          value: opsdesk
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DD_AGENT_HOST
            valueFrom:
              fieldRef: { fieldPath: status.hostIP }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATADOG_API_KEY
            valueFrom:
              secretKeyRef: { name: datadog, key: api-key }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SPRING_PROFILES_ACTIVE, value: datadog }
      - equal:
          path: spec.template.metadata.annotations["ad.datadoghq.com/opsdesk.logs"]
          value: '[{"source":"java","service":"opsdesk"}]'

  - it: keeps other Spring profiles and adds datadog
    set:
      datadog.enabled: true
      datadog.apiKeySecret: datadog
      springProfiles: demo
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SPRING_PROFILES_ACTIVE, value: "demo,datadog" }

  - it: needs the Secret with the API key when enabled
    set:
      datadog.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: datadog.apiKeySecret is required when datadog.enabled (Secret with key api-key)
