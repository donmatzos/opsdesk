# Secure defaults. Stage files (values-dev.yaml, values-prod.yaml) override only what differs.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/donmatzos/opsdesk
  # Empty = .Chart.AppVersion. CI deploys immutable tags: sha-<short commit>.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Comma-separated Spring profiles, e.g. "demo" for the demo data. Empty = none.
springProfiles: ""

database:
  # JDBC URL of an external PostgreSQL (required unless devDatabase.enabled).
  url: ""
  username: opsdesk
  # Name of an existing Secret with the password; created outside the chart (never in values).
  existingSecret: ""
  passwordKey: password

# In-namespace PostgreSQL for dev/demo stages (Red Hat sclorg image, runs under OpenShift's random UID).
# The password is generated in the cluster on first install and kept on upgrades; never in values.
# Helm-only: with GitOps rendering (ArgoCD, helm template) lookup sees nothing and would regenerate it on every
# sync; there use database.existingSecret instead.
devDatabase:
  enabled: false
  image: quay.io/sclorg/postgresql-18-c10s:20261104
  storage: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

service:
  # ClusterIP behind the Route/Ingress; NodePort only for local clusters (tools/kind-verify.sh).
  type: ClusterIP
  nodePort: null

# OpenShift Route with edge TLS (the router terminates TLS, HTTP redirects to HTTPS).
route:
  enabled: true
  host: ""

# Plain Kubernetes alternative to the Route.
ingress:
  enabled: false
  className: ""
  host: ""

networkPolicy:
  enabled: true
  # Labels of the namespace whose pods may reach the app. Empty = the OpenShift router namespace
  # (policy-group.network.openshift.io/ingress). Empty on purpose: Helm merges maps, so a non-empty default would
  # be ANDed with your labels. With ingress.enabled on plain Kubernetes, set your controller's namespace
  # (e.g. kubernetes.io/metadata.name: ingress-nginx); rendering fails otherwise. Routers on HostNetwork need
  # policy-group.network.openshift.io/host-network: "".
  ingressNamespaceLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# MOCK: no Datadog account. Unified Service Tagging (env/service/version), agent host for traces/DogStatsD and
# log autodiscovery for a cluster with the Datadog agent; also switches on the app's "datadog" metrics profile.
datadog:
  enabled: false
  env: dev
  # Existing Secret with key "api-key" (required when enabled); created outside the chart.
  apiKeySecret: ""

podAnnotations: {}
